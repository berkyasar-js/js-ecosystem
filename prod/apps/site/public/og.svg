    <path d="M18 13h13v26c0 10-6 15-15 15V43c4 0 5-1 5-5V13" fill="#edf0ff"/>
    <circle cx="46" cy="46" r="7" fill="#ff4200"/>
    <text x="84" y="44" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#f0f0f7">JS <tspan fill="#8c93ff">Workspace</tspan></text>
