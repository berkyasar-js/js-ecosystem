    <rect x="204" width="110" height="40" rx="20" fill="#202438"/><text x="259" y="26" text-anchor="middle" fill="#c9cdf0">MCP</text>
    <rect x="328" width="170" height="40" rx="20" fill="#202438"/><text x="413" y="26" text-anchor="middle" fill="#c9cdf0">Supabase RLS</text>
    <rect x="512" width="160" height="40" rx="20" fill="#2f2a55"/><text x="592" y="26" text-anchor="middle" fill="#c9bbff">Kurul Sohbeti</text>
