  <text x="80" y="300" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="68" font-weight="700" fill="#f0f0f7" letter-spacing="-2">Ajanslar için yapay zekâ</text>
  <text x="80" y="380" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="68" font-weight="700" fill="url(#t)" letter-spacing="-2">destekli çalışma alanı</text>
  <text x="80" y="450" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="26" fill="#a2a6bc">Projeler · Müşteriler · Üretim · Ekip · Finans · 9 kişilik yapay zekâ kurulu</text>
